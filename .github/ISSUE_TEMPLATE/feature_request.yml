name: 功能建议（Feature Request）
description: 提出一个新功能或改进
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 背景与痛点
      description: 这个功能要解决什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围
      options:
        - label: 服务端门禁 / 下载 / 替换逻辑
        - label: 客户端下载 / 安装 / 增量
        - label: 镜像池 / 代理竞速
        - label: CI / 发布 / 文档
